<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphabet Clash</title>

    <!-- Tailwind CSS CDN (Stable) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI CDN (Stable) -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body class="min-h-screen bg-[#010313] font-poppins">
    <main
      class="bg-[url(images/background.png)] bg-no-repeat min-h-screen bg-center"
    >
      <!-- Home Screen -->
      <section
        id="home-screen"
        class="home text-white flex flex-col items-center justify-center gap-4 min-h-screen"
      >
        <div class="flex flex-col items-center gap-8">
          <h2 class="text-8xl uppercase font-anton">Alpha clash pro</h2>
          <p>Unleash your keyboard kung fu : Press Enter to play</p>
          <button onclick="play()" class="btn btn-primary btn-lg bg-[white]">
            Play Now
          </button>
        </div>
      </section>

      <!-- Play Ground Start -->
      <section
        id="play-ground"
        class="play-ground min-h-screen flex flex-col items-center justify-center p-4 hidden"
      >
        <!-- Play Ground Container -->
        <div class="flex flex-col items-center justify-center gap-8">
          <!-- Playground Screen -->
          <div
            class="artboard artboard-horizontal phone-6 border-[20px] rounded-2xl border-[#010313cc] bg-[#FFFFFFB3] flex flex-col justify-between"
          >
            <!-- Top Alert Banner -->
            <div class="flex justify-center">
              <p class="bg-[#2F2941] px-6 py-2 text-white rounded-b-xl text-sm">
                Don't watch keyboard while playing...
              </p>
            </div>

            <!-- Central Alphabet Display -->
            <div class="flex justify-center items-center h-full">
              <p
                id="current-alphabet"
                class="text-9xl font-bold uppercase text-black"
              >
                Y
              </p>
            </div>
          </div>

          <!-- Keyboard Start -->
          <div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="q" class="kbd">q</kbd>
              <kbd id="w" class="kbd">w</kbd>
              <kbd id="e" class="kbd">e</kbd>
              <kbd id="r" class="kbd">r</kbd>
              <kbd id="t" class="kbd">t</kbd>
              <kbd id="y" class="kbd">y</kbd>
              <kbd id="u" class="kbd">u</kbd>
              <kbd id="i" class="kbd">i</kbd>
              <kbd id="o" class="kbd">o</kbd>
              <kbd id="p" class="kbd">p</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="a" class="kbd">a</kbd>
              <kbd id="s" class="kbd">s</kbd>
              <kbd id="d" class="kbd">d</kbd>
              <kbd id="f" class="kbd">f</kbd>
              <kbd id="g" class="kbd">g</kbd>
              <kbd id="h" class="kbd">h</kbd>
              <kbd id="j" class="kbd">j</kbd>
              <kbd id="k" class="kbd">k</kbd>
              <kbd id="l" class="kbd">l</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="z" class="kbd">z</kbd>
              <kbd id="x" class="kbd">x</kbd>
              <kbd id="c" class="kbd">c</kbd>
              <kbd id="v" class="kbd">v</kbd>
              <kbd id="b" class="kbd">b</kbd>
              <kbd id="n" class="kbd">n</kbd>
              <kbd id="m" class="kbd">m</kbd>
              <kbd id="/" class="kbd">/</kbd>
            </div>
          </div>
          <!-- Keyboard End -->

          <!-- Life & Score -->
          <div class="flex justify-between w-full">
            <button
              class="btn rounded-full bg-[#894189] hover:bg-[#723272] text-white border-none px-6"
            >
              <span>Life</span>
              <img src="images/love.svg" alt="life icon" />
              <span id="current-life">5</span>
            </button>
            <button
              class="btn rounded-full bg-[#360490] hover:bg-[#2b0373] text-white border-none px-6"
            >
              <span>Score</span>
              <img src="images/dolar.svg" alt="score icon" />
              <span id="current-score">0</span>
            </button>
          </div>
        </div>
      </section>
      <!-- Play Ground End -->

      <!-- Final Score Screen -->
      <section
        id="final-score"
        class="score flex justify-center items-center min-h-screen hidden"
      >
        <div
          class="text-white text-center space-y-6 bg-[#FFFFFF33] p-8 rounded-2xl"
        >
          <h3 class="text-3xl font-bold">Game Over !</h3>
          <h1 class="text-8xl">
            <span class="font-extrabold">Score</span>
            <span id="game-score">14</span>
          </h1>
          <button onclick="play()" class="btn bg-[#FFFFFF] text-black">
            Play Again
          </button>
          <p>Practice will make you a pro</p>
        </div>
      </section>
    </main>
    <script src="scripts/utility.js"></script>
    <script src="scripts/alpha-clash.js"></script>
  </body>
</html>
